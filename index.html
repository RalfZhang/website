    <meta name="theme-color" content="#eee8d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!--
      Resolve the theme before first paint: an explicit choice wins, otherwise
      follow the OS. Inline on purpose — doing it from the bundle would flash the
      wrong palette for a frame.
    -->
    <!--
      Every page lives under /en or /zh. A path without one ("/", or an old
      link like /works) goes on to the visitor's language: their own pick from
      the switcher if they made one, else the first of the browser's languages
      that's Chinese (any variety → /zh) or English; /en if neither. Mirrors
      src/i18n/locales.ts. Pages that have a language just get <html lang>.
    -->
    <script>
      (function () {
        var tags = { en: "en", zh: "zh-CN" };
        var isLang = function (s) { return Object.prototype.hasOwnProperty.call(tags, s); };
        var seg = location.pathname.split("/")[1];
        if (isLang(seg)) {
          document.documentElement.lang = tags[seg];
          return;
        }
        var l = null;
        try { l = localStorage.getItem("lang"); } catch (e) {}
        if (!isLang(l)) {
          l = "en";
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
          for (var i = 0; i < prefs.length; i++) {
            var p = String(prefs[i]).toLowerCase().split("-")[0];
            if (isLang(p)) { l = p; break; }
          }
        }
        location.replace("/" + l + location.pathname + location.search + location.hash);
      })();
    </script>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>

        </ul>
        <p><a href="/en/" hreflang="en">English</a> · <a href="/zh/" hreflang="zh" lang="zh-CN">中文</a></p>

    </noscript>
