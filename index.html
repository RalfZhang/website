<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Ralf Zhang</title>

    <meta property="og:title" content="Ralf Zhang" />
    <meta property="og:description" content="InkCity, File Template, Big Ben and other things I've made." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#eee8d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!--
      Resolve the theme before first paint: an explicit choice wins, otherwise
      follow the OS. Inline on purpose — doing it from the bundle would flash the
      wrong palette for a frame.
    -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="padding: 2rem; font: 16px/1.8 system-ui, sans-serif">

</html>
